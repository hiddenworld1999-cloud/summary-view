<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>مبادئ الاستثمار</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: #f5f5f5;
  font-family: Arial, sans-serif;
  text-align: center;
}

/* اختيار */
.choices {
  padding: 30px;
}

.choices button {
  padding: 15px 25px;
  font-size: 18px;
  margin: 10px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background: #2a5298;
  color: white;
}

.choices button:hover {
  background: #1e3c72;
}

/* viewer */
.viewer {
  max-width: 800px;
  margin: auto;
  padding: 20px;
}

/* canvas */
canvas {
  width: 100%;
  margin-bottom: 20px;
  user-select: none;
  pointer-events: none;
}
</style>
</head>
<body>

<!-- اختيار -->
<div id="choices" class="choices">
  <h2>اختر نوع الأسئلة</h2>
  <button onclick="loadInvestment(false)">📘 بدون إجابات</button>
  <button onclick="loadInvestment(true)">✅ بالإجابات</button>
</div>

<!-- الصور -->
<div id="viewer" class="viewer"></div>

<script>
/* حماية */
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("selectstart", e => e.preventDefault());
document.addEventListener("keydown", e => {
  if (e.ctrlKey && ['c','s','p','u'].includes(e.key.toLowerCase())) {
    e.preventDefault();
  }
});

/* اسم الطالب */
const student = sessionStorage.getItem("studentName");
if (!student) {
  window.location.href = "login.html";
}

/* تحميل الصور تدريجي (سريع) */
function loadInvestment(withAnswers) {
  document.getElementById("choices").style.display = "none";

  const viewer = document.getElementById("viewer");
  const totalPages = 18;
  let i = 1;

  function loadNext() {
    if (i > totalPages) return;

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    const img = new Image();
    const num = String(i).padStart(2, '0');

    img.src = withAnswers
      ? `investment-${num}.png`
      : `investment-no-${num}.png`;

    img.onload = () => {
      canvas.width = img.width;
      canvas.height = img.height;

      // رسم الصورة
      ctx.drawImage(img, 0, 0);

      // العلامة المائية
      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.rotate(-25 * Math.PI / 180);
      ctx.font = "80px Arial";
      ctx.fillStyle = "rgba(0,0,0,0.2)";
      ctx.textAlign = "center";
      ctx.fillText("خاص للطالب/ة", 0, 0);
      ctx.fillText(student, 0, 110);
      ctx.restore();

      viewer.appendChild(canvas);

      i++;
      setTimeout(loadNext, 80); // تحميل صورة صورة (سريع)
    };
  }

  loadNext();
}
</script>

</body>
</html>
