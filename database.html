<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>مادة قواعد البيانات</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: #f5f5f5;
  font-family: Arial, sans-serif;
  text-align: center;
}

/* اختيار */
.choices {
  padding: 30px;
}

.choices button,
#backBtn {
  padding: 15px 25px;
  font-size: 18px;
  margin: 10px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background: #2a5298;
  color: white;
}

.choices button:hover,
#backBtn:hover {
  background: #1e3c72;
}

/* viewer */
.viewer {
  max-width: 800px;
  margin: auto;
  padding: 20px;
}

/* canvas */
canvas {
  width: 100%;
  margin-bottom: 20px;
  user-select: none;
}
</style>
</head>
<body>

<!-- اختيار -->
<div id="choices" class="choices">
  <h2>اختر نوع الأسئلة</h2>
  <button onclick="loadDatabase('no')">📘 بدون إجابات</button>
  <button onclick="loadDatabase('yes')">✅ بالإجابات</button>
  <button onclick="loadDatabase('essay')">📝 مقالي</button>
</div>

<!-- زر رجوع -->
<button id="backBtn" onclick="goBack()" style="display:none;">⬅ رجوع</button>

<!-- الصور -->
<div id="viewer" class="viewer"></div>

<script>
/* حماية بسيطة */
document.addEventListener("contextmenu", e => e.preventDefault());

/* الاسم */
const student = sessionStorage.getItem("studentName");
if (!student) {
  window.location.href = "login.html";
}

/* تحميل الصور */
function loadDatabase(type) {
  document.getElementById("choices").style.display = "none";
  document.getElementById("backBtn").style.display = "inline-block";

  const viewer = document.getElementById("viewer");
  viewer.innerHTML = "";

  let startPage = 1;
  let endPage = 36;

  if (type === "essay") {
    startPage = 37;
    endPage = 47;
  }

  for (let i = startPage; i <= endPage; i++) {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    const img = new Image();

    const num = String(i).padStart(2, '0');

    if (type === "yes") {
      img.src = `database-${num}.jpg`;
    } else if (type === "no") {
      img.src = `database-no-${num}.jpg`;
    } else {
      img.src = `database-${num}.jpg`; // المقالي يستخدم نفس اسم الصور
    }

    img.onload = () => {
      canvas.width = img.width;
      canvas.height = img.height;

      ctx.drawImage(img, 0, 0);

      /* علامة مائية */
      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.rotate(-25 * Math.PI / 180);
      ctx.font = "90px Arial";
      ctx.fillStyle = "rgba(0,0,0,0.2)";
      ctx.textAlign = "center";
      ctx.fillText("خاص للطالب/ة", 0, 0);
      ctx.fillText(student, 0, 120);
      ctx.restore();
    };

    viewer.appendChild(canvas);
  }
}

/* رجوع */
function goBack() {
  document.getElementById("choices").style.display = "block";
  document.getElementById("viewer").innerHTML = "";
  document.getElementById("backBtn").style.display = "none";
}
</script>

</body>
</html>
